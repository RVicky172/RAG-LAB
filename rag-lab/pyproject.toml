[project]
name = "rag-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "openai>=3.50.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"   # CUDA 12.8+ build: required for RTX 50-series (Blackwell)
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
