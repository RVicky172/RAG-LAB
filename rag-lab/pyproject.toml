[project]
name = "rag-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.2",
    "chromadb>=1.5.9",
    "docling>=2.150.1",
    "faiss-cpu>=1.16.0",
    "numpy>=2.5.4",
    "openai>=3.50.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag"
module-root = "src"            # the folder that contains rag/

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"   # CUDA 12.8+ build: required for RTX 50-series (Blackwell)
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
