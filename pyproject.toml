[project]
name = "rag-agents"
version = "0.1.0"
description = "One-day learning project: RAG, an AI agent and a multi-agent system, each with evaluation, then deployed on AWS."
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.17.3",
    "fastapi>=0.163.2",                 # HTTP API (Doc 4)
    "langchain>=1.5.0",                 # create_agent, tools, chat-model wrapper (Docs 2-3)
    "langchain-openai>=1.8.1",          # talks to LM Studio locally and Bedrock on AWS
    "langchain-text-splitters>=1.1.3",  # chunking (Doc 1)
    "openai>=3.3.0",                    # client used by the RAGAS judge
    "openinference-instrumentation-langchain>=0.1.87",
    "openinference-instrumentation-openai>=0.1.74",
    "pymupdf>=2.1",                     # PDF -> text (Doc 1)
    "python-dotenv>=1.2.4",             # reads .env
    "qdrant-client[fastembed]>=1.20.0", # vector database client + local embedding model
    "ragas>=0.4.4",                     # evaluation metrics (all docs)
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",                  # runs the FastAPI app
]

[tool.uv]
package = false   # an app run with `python -m app.<module>`, not an installable library
